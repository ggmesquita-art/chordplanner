[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music_ai_module"
version = "0.1.0"
description = "Music AI generation and theoretical planning module for ChordPlanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "midigpt==0.4.2",
    "music21>=9.0.0",
    "symusic>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["music_ai_module*"]
